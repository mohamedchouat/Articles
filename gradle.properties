org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Toggles the REST API debugger (github.com/mohamedchouat/rest-api-debugger)
# in debug builds. Override on the command line with -PdebugRestApi=false.
# Release builds always hard-disable it regardless of this flag (see
# app/build.gradle.kts).
debugRestApi=true

# When the debugger is enabled, makes its notification play a sound
# specifically when the latest API call failed (network error or non-2xx
# status) instead of staying silent for every update. Override with
# -PalertOnApiFailure=false.
alertOnApiFailure=true
